mapping:
  model: configurable_residual_test
  layers:
    - id: input
      op: input
      pe: 0
      core: 0
      router: 0
      neurons: 1
      output_channels: 1
      virtual_input: true
    - id: main
      op: conv2d
      pe: 1
      core: 0
      router: 1
      source_neurons: 1
      neurons: 1
      input_channels: 1
      output_channels: 1
      weight_prefix: main
    - id: post
      op: conv2d
      pe: 2
      core: 0
      router: 2
      source_neurons: 1
      neurons: 1
      input_channels: 1
      output_channels: 1
      weight_prefix: post
      membrane_quantization_step: 0.015625
      threshold_comparison: greater
      reset: soft
  connections:
    - from: input
      to: main
      type: spatial
      weight_prefix: main
      delay: 0
    - from: main
      to: post
      type: spatial
      weight_prefix: post
      delay: 0
    - from: input
      to: post
      type: identity
      weight_prefix: skip
      delay: 1
  routes:
    - from: input
      to: main
      routers: [0, 1]
    - from: main
      to: post
      routers: [1, 2]
    - from: input
      to: post
      routers: [0, 1, 2]
